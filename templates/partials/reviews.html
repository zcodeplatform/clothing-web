{% from '_macros.html' import icon %}
<section class="container section">
  <h2 class="h2-xl">Our Client Reviews</h2>
  <div class="reviews">
    {% for r in reviews %}
      <figure class="review">
        <div class="stars" aria-label="5 out of 5 stars">{% for _ in range(5) %}{{ icon('star', 'icon', solid=True) }}{% endfor %}</div>
        <blockquote>“{{ r.text }}”</blockquote>
        <figcaption>
          <img src="{{ url_for('static', filename='img/' ~ r.image) }}" alt="{{ r.name }}" loading="lazy" width="768" height="1024">
          <span><strong>{{ r.name }}</strong><small>{{ r.place }}</small></span>
        </figcaption>
      </figure>
    {% endfor %}
  </div>
</section>
