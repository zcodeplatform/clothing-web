<section id="faq" class="container section anchor">
  <div class="split split--start">
    <div class="split__media split__media--second">
      <img src="{{ url_for('static', filename='img/faq-shopping.jpg') }}" alt="Friends browsing colourful dresses in the store" loading="lazy" width="864" height="1088" class="img-45">
    </div>
    <div class="split__text split__text--first">
      <h2 class="h2-xl">Frequently Asked <span class="muted-soft">Questions</span></h2>
      <div class="accordion">
        {% for f in faqs %}
          <details name="faq" {{ 'open' if loop.first }}>
            <summary>{{ f.q }}<svg class="icon chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></summary>
            <p>{{ f.a }}</p>
          </details>
        {% endfor %}
      </div>
    </div>
  </div>
</section>
